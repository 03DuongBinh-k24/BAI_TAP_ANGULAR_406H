<p>Danh sách Khách hàng theo Nhóm</p>

<p style="color: red;">{{ errMessage }}</p>

<table border="1" style="border-collapse: collapse; width: 80%;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  <ng-container *ngFor="let group of customerGroups">
    <!-- Hiển thị dòng tiêu đề Nhóm khách hàng -->
    <tr style="background-color: #e0e0e0; font-weight: bold;">
      <td colspan="5">
        {{ group.CustomerTypeId }} - {{ group.CustomerTypeName }}
      </td>
    </tr>
    <!-- Vòng lặp duyệt danh sách Khách hàng thuộc nhóm -->
    <tr *ngFor="let c of group.Customers">
      <td>{{ c.Id }}</td>
      <td>{{ c.Name }}</td>
      <td>{{ c.Email }}</td>
      <td>{{ c.Age }}</td>
      <td>
        <img [src]="c.Image" width="40" height="40" alt="avatar" />
      </td>
    </tr>
  </ng-container>
</table>
