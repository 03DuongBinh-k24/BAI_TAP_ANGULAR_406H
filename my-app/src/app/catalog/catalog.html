<table border="1" class="main-table">
  <thead>
    <tr>
      <th>Ma Danh Muc</th>
      <th>Ten Danh Muc</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let cate of categories">
      <tr>
        <td>{{ cate.Cateid }}</td>
        <td>{{ cate.CateName }}</td>
      </tr>
      
      <tr>
        <td colspan="2">
          <table border="1" class="sub-table">
            <thead>
              <tr>
                <th>Ma San Pham</th>
                <th>Ten San Pham</th>
                <th>Gia San Pham</th>
                <th>Picture</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let prod of cate.Products">
                <td>{{ prod.ProductId }}</td>
                <td>{{ prod.ProductName }}</td>
                <td>{{ prod.Price }}</td>
                <td>
                  <img [src]="prod.Image" [alt]="prod.ProductName" class="product-img">
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
