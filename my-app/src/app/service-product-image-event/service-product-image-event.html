<h2>Danh sách sản phẩm</h2>
<table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
  <thead>
    <tr>
      <th>Mã Sản Phẩm</th>
      <th>Tên Sản Phẩm</th>
      <th>Giá Sản Phẩm</th>
      <th>Picture</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products">
      <td>{{p.ProductId}}</td>
      <td>{{p.ProductName}}</td>
      <td>{{p.Price}}</td>
      <td>
        <img [src]="p.Image" width="80" height="80" [alt]="p.ProductName" />
      </td>
      <td>
        <button (click)="viewDetail(p)">Details</button>
      </td>
    </tr>
  </tbody>
</table>
